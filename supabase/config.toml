project_id = "dogo"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:3000", "dogo://"]
[auth.email]
enable_signup = true
enable_confirmations = false
